name: CI

on:
  push:
  pull_request:

jobs:
  msvc:
    name: msvc (${{ matrix.config }}, ${{ matrix.shared == 'ON' && 'dll' || 'static' }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        shared: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset msvc-x64-ci -DPERIODIC_CALLER_SHARED=${{ matrix.shared }}
      - name: Build
        run: cmake --build build --config ${{ matrix.config }}
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
      - name: Run example (precision report)
        run: build/${{ matrix.config }}/periodic_caller_example.exe
