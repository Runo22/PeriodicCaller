name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config ${{ matrix.config }}
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
      - name: Run example (precision report)
        run: build/${{ matrix.config }}/periodic_caller_example.exe
